<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Humana — Megatiendas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #f1f5f9; font-family: Arial, sans-serif; }
    #chatArea { flex: 1; overflow-y: auto; }
    #chatArea::-webkit-scrollbar { width: 4px; }
    #chatArea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    @keyframes bounce-dot {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    .dot-typing span {
      display: inline-block;
      width: 7px; height: 7px;
      background: #94a3b8;
      border-radius: 50%;
      margin: 0 2px;
    }
    .dot-typing span:nth-child(1) { animation: bounce-dot 1.2s infinite 0ms; }
    .dot-typing span:nth-child(2) { animation: bounce-dot 1.2s infinite 200ms; }
    .dot-typing span:nth-child(3) { animation: bounce-dot 1.2s infinite 400ms; }
  </style>
</head>
<body>

  <!-- Header -->
  <header style="background:#003087" class="text-white px-4 py-3 shadow-md flex-shrink-0">
    <div class="max-w-2xl mx-auto flex items-center gap-3">
      <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center flex-shrink-0">
        <span style="color:#D41830" class="font-extrabold text-sm">MG</span>
      </div>
      <div>
        <p class="font-bold text-sm leading-tight">Gestión Humana</p>
        <p class="text-xs text-blue-200">Megatiendas Invercomer</p>
      </div>
    </div>
  </header>

  <!-- Email bar -->
  <div class="bg-white border-b border-gray-200 px-4 py-2 flex-shrink-0">
    <div class="max-w-2xl mx-auto flex items-center gap-2">
      <span class="text-xs font-semibold text-gray-500 flex-shrink-0">Tu correo:</span>
      <input id="emailInput" type="email" placeholder="nombre@empresa.com"
        class="flex-1 text-sm border border-gray-300 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2"
        style="--tw-ring-color:#003087">
      <button onclick="saveEmail()"
        class="text-xs font-semibold px-3 py-1.5 rounded-lg text-white flex-shrink-0 hover:opacity-90 transition"
        style="background:#003087">Guardar</button>
    </div>
  </div>

  <!-- Messages -->
  <div id="chatArea" class="px-4 py-4">
    <div id="msgList" class="max-w-2xl mx-auto space-y-4">

      <!-- Mensaje bienvenida -->
      <div class="flex gap-2 items-end">
        <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center" style="background:#003087">
          <span class="text-white text-xs font-bold">GH</span>
        </div>
        <div class="bg-white rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm" style="max-width:80%">
          <p class="text-sm text-gray-700">Hola 👋 Soy el asistente virtual de <strong>Gestión Humana</strong> de Megatiendas. ¿En qué puedo ayudarte hoy?</p>
          <p class="text-[10px] text-gray-400 mt-1.5">Nómina · SST · Jurídica · P&amp;P · General</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Input -->
  <div class="bg-white border-t border-gray-200 px-4 py-3 flex-shrink-0">
    <div class="max-w-2xl mx-auto flex items-end gap-2">
      <textarea id="msgInput" placeholder="Escribe tu consulta…" rows="1"
        class="flex-1 text-sm border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 resize-none overflow-hidden"
        style="max-height:120px; --tw-ring-color:#003087"
        oninput="autoResize(this)"
        onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" onclick="sendMessage()"
        class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0 hover:opacity-90 transition"
        style="background:#003087">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm font-semibold text-white shadow-lg z-50 hidden transition-all"></div>

<script>
  const emailInput = document.getElementById('emailInput');
  emailInput.value = localStorage.getItem('gh_email') || '';

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function saveEmail() {
    const v = emailInput.value.trim();
    if (!v) { toast('Ingresa un correo válido', true); return; }
    localStorage.setItem('gh_email', v);
    toast('✅ Correo guardado');
  }

  function toast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = isError ? '#ef4444' : '#10b981';
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 2500);
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function scrollBottom() {
    const area = document.getElementById('chatArea');
    area.scrollTop = area.scrollHeight;
  }

  function addBubble(html) {
    document.getElementById('msgList').insertAdjacentHTML('beforeend', html);
    scrollBottom();
  }

  function addUserMsg(text) {
    addBubble(`
      <div class="flex justify-end">
        <div class="rounded-2xl rounded-br-sm px-4 py-3 shadow-sm text-sm text-white" style="background:#003087; max-width:80%">
          ${esc(text)}
        </div>
      </div>`);
  }

  function addBotMsg(text, email, category) {
    const catColors = { SST:'#D41830', Nómina:'#1a56db', Jurídica:'#7e3af2', 'P&P':'#057a55', General:'#374151' };
    const color = catColors[category] || '#374151';
    addBubble(`
      <div class="flex gap-2 items-end">
        <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center" style="background:#003087">
          <span class="text-white text-xs font-bold">GH</span>
        </div>
        <div class="bg-white rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm" style="max-width:80%">
          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full text-white mb-2 inline-block" style="background:${color}">${esc(category)}</span>
          <p class="text-sm text-gray-700 whitespace-pre-wrap">${esc(text)}</p>
          <p class="text-[10px] text-emerald-600 font-semibold mt-2">✉️ Resumen enviado a ${esc(email)}</p>
        </div>
      </div>`);
  }

  function addTyping() {
    const id = 'typing_' + Date.now();
    addBubble(`
      <div id="${id}" class="flex gap-2 items-end">
        <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center" style="background:#003087">
          <span class="text-white text-xs font-bold">GH</span>
        </div>
        <div class="bg-white rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm">
          <div class="dot-typing"><span></span><span></span><span></span></div>
        </div>
      </div>`);
    return id;
  }

  async function sendMessage() {
    const email   = emailInput.value.trim();
    const input   = document.getElementById('msgInput');
    const message = input.value.trim();
    const btn     = document.getElementById('sendBtn');

    if (!email) { toast('Ingresa tu correo electrónico primero', true); emailInput.focus(); return; }
    if (!message) return;

    localStorage.setItem('gh_email', email);
    input.value = '';
    input.style.height = 'auto';
    btn.disabled = true;
    btn.style.opacity = '0.5';

    addUserMsg(message);
    const typingId = addTyping();

    try {
      const res  = await fetch('/api/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, message })
      });
      const data = await res.json();
      document.getElementById(typingId)?.remove();

      if (!res.ok) {
        addBubble(`<div class="flex gap-2 items-end">
          <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center bg-red-100">
            <span class="text-red-500 text-xs font-bold">!</span>
          </div>
          <div class="bg-red-50 border border-red-200 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm text-sm text-red-600" style="max-width:80%">
            ${esc(data.error || 'Error procesando tu consulta.')}
          </div>
        </div>`);
      } else {
        addBotMsg(data.response, email, data.category);
      }
    } catch {
      document.getElementById(typingId)?.remove();
      addBubble(`<div class="flex gap-2 items-end">
        <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center bg-red-100">
          <span class="text-red-500 text-xs font-bold">!</span>
        </div>
        <div class="bg-red-50 border border-red-200 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm text-sm text-red-600" style="max-width:80%">
          Error de conexión. Intenta de nuevo.
        </div>
      </div>`);
    }

    btn.disabled = false;
    btn.style.opacity = '1';
    input.focus();
  }
</script>
</body>
</html>
